  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142d40;background:#f3f7fa;font-synthesis:none;text-rendering:optimizeLegibility;--blue:#075985;--blue2:#0e7490;--green:#16845b;--muted:#607487;--line:#e1eaf0;--card:#fff;--shadow:0 10px 28px rgba(24,56,78,.07)}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#0879a4,#0d8661);color:white;display:grid;place-items:center;font-size:23px}.brand strong{display:block;color:#123b55;font-size:15px}.brand small{color:var(--muted);font-size:11px}.topright{display:flex;align-items:center;gap:12px}.demo-pill{border-radius:100px;padding:7px 11px;background:#fff4d6;color:#805600;font-weight:700;font-size:11px}.userbox{display:flex;align-items:center;gap:9px;font-size:13px}.avatar{height:35px;width:35px;border-radius:50%;display:grid;place-items:center;background:#e4f2f8;color:#075985;font-weight:800}.layout{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{padding:23px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 72px);background:#fbfdfe}.navlabel{padding:0 12px;color:#91a1ae;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;margin:7px 0 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#516779;font-size:13px;font-weight:600;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#e8f4f8;color:#075985}.nav .ico{width:20px;text-align:center;font-size:16px}.side-note{ 100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8a9ba8;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eef2f5;font-size:12px;color:#405b6e}tr:last-child td{border-bottom:0}.patient-name{font-weight:750;color:#183c55;cursor:pointer}.patient-id{display:block;color:#8798a5;font-size:10px;margin-top:3px}.badge{display:inline-flex;align-items:center;border-radius:100px;padding:5px 8px;font-size:10px;font-weight:750;background:#edf3f6;color:#536c7d}.badge.red{background:#fff0ee;color:#b4483f}.badge.amber{background:#fff6df;color:#946500}.badge.green{background:#e9f7ef;color:#18724a}.badge.blue{background:#e8f3fa;color:#17658a}.link{border:0;background:none;color:#08749b;font-weight:750;font-size:11px}.barlist{display:grid;gap:14px}.barrow{display:grid;grid-template-columns:90px 1fr 25px;align-items:center;gap:8px;font-size:11px;color:#617788}.track{height:8px;background:#edf2f5;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#0d82a5,#20a578)}.notice{padding:12px 13px;border-radius:10px;background:#fff8e8;color:#75590f;font-size:11px;line-height:1.5;margin:12px 0}.notice.green{background:#edf8f2;color:#356d4e}.tabrow{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}.tabrow button{border:0;background:none;padding:10px 12px;color:#698092;font-size:12px;font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}.tabrow button.active{color:var(--blue);border-color:var(--blue)}.patienthero{padding:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:15px}.patienthero h2{margin:0 0 6px;font-size:20px;color:#163b54}.patienthero p{margin:0;color:var(--muted);font-size:12px}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:17px}.detail{padding:11px;background:#f7f rgin-top:18px}.filterrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.segment{display:flex;border:1px solid var(--line);background:#fff;border-radius:9px;padding:3px}.segment button{border:0;border-radius:6px;background:none;padding:7px 10px;color:#688092;font-size:11px;font-weight:700}.segment button.active{background:#e8f4f8;color:#086386}.footer-note{text-align:center;color:#8495a1;font-size:10px;margin:28px 0 0}.histitem{border-left:2px solid #cfe5ed;padding:0 0 16px 14px;margin-left:6px;position:relative}.histitem:before{content:"";position:absolute;left:-5px;top:2px;width:8px;height:8px;border-radius:50%;background:#1483a2}.histitem strong{font-size:12px;color:#244a63}.histitem p{font-size:11px;color:#698092;margin:5px 0}.muted{color:var(--muted)}
@media(max-width:980px){.layout{grid-template-columns:190px 1fr}.main{padding:24px 20px}.stats{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.details{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.topbar{height:62px;padding:0 14px}.brandmark{width:36px;height:36px}.brand strong{font-size:13px}.brand small{font-size:9px}.topright{gap:7px}.demo-pill{font-size:9px;padding:6px}.userbox span:not(.avatar){display:none}.layout{display:block}.sidebar{display:none}.main{padding:20px 14px 90px}.pagehead{display:block}.pagehead h1{font-size:23px}.pagehead .actions{margin-top:13px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:22px}.stathead{font-size:10px}.staticon{width:29px;height:29px}.section{padding:14px}.details{grid-template-columns:repeat(2,1fr)}.patienthero{display:block}.patienthero .actions{margin-top:12px}.formgrid{grid-template-columns:1fr}.formfield.full{grid-column:auto}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:65px;background:#fff;border-top:1px solid var(--line);z-index:6;justify-content:space-around;padding:5px 4px env(safe-area-inset-bottom)}.mobile-nav button{flex:1;border:0;background:none;color:#708695;font-size:9px;font-weight:700;display:grid;place-content:center;gap:2px}.mobile-nav button span:first-child{font-size:18px}.mobile-nav button.active{color:var(--blue)}.filterrow{align-items:stretch}.filterrow select{flex:1}.tablewrap table{min-width:760px}.pagehead p{line-height:1.5}.hide-mobile{display:none}}
@media print{.topbar,.sidebar,.mobile-nav,.actions,.filters,.tabrow,.footer-note{display:none!important}.layout{display:block}.main{padding:0}.card{box-shadow:none}.shell{background:white}.pagehead h1{font-size:20px}}

<body>
<div class="shell" id="app"></div>
<script>
(()=>{
const KEY='raps-pg-demo-v1';
const initial={role:'Psiquiatra visitador',patients:[
 {id:'PG-DEMO-001',name:'Marina A.',unit:'Hospital Irmã Dulce',place:'Enfermaria — Leito 04',entry:daysAgo(6),priority:'Alta',visit:'Pendente',last:'—',next:today(),caps:'CAPS II Boqueirão',discharge:plusDays(2),age:34,sex:'Feminino',group:'Transtornos do humor',active:true,notes:'Articulação com CAPS pendente',hasCaps:true,interventions:[{id:'i1',cat:'Psicologia',owner:'Equipe demo',plan:'Acolhimento e avaliação psicossocial',frequency:'2x/semana',goal:'Construir estratégias de cuidado',status:'Em andamento',review:plusDays(3)},{id:'i2',cat:'Serviço social',owner:'Equipe demo',plan:'Contato com rede de apoio e CAPS',frequency:'Conforme necessidade',goal:'Organizar continuidade do cuidado',status:'Pendente',review:plusDays(1)}],evolutions:[],history:[]},
 {id:'PG-DEMO-002',name:'Carlos R.',unit:'PS/UPA Quietude',place:'Observação — Box 08',entry:daysAgo(2),priority:'Média',visit:'Pendente',last:'—',next:today(),caps:'A definir',discharge:plusDays(1),age:27,sex:'Masculino',group:'Transtornos relacionados a substâncias',active:true,notes:'Definir CAPS de referência',hasCaps:false,interventions:[{id:'i3',cat:'Psiquiatria',owner:'Equipe demo',plan:'Avaliação psiquiátrica e plano inicial',frequency:'Visita',goal:'Avaliação e articulação de rede',status:'Pendente',review:plusDays(1)}],evolutions:[],history:[]},
 {id:'PG-DEMO-003',name:'Joana S.',unit:'UPA Samambaia',place:'Observação — Leito 02',entry:daysAgo(1),priority:'Alta',visit:'Realizada',last:daysAgo(1),next:today(),caps:'CAPS AD Praia Grande',discharge:plusDays(4),age:42,sex:'Feminino',group:'Transtornos relacionados a substâncias',active:true,notes:'Confirmar acolhimento no CAPS',hasCaps:true,interventions:[{id:'i4',cat:'Enfermagem',owner:'Equipe demo',plan:'Acompanhamento e orientações',frequency:'Diário',goal:'Monitorar necessidades e cuidados',status:'Em andamento',review:plusDays(2)}],evolutions:[],history:[]},
 {id:'PG-DEMO-004',name:'Rafael M.',unit:'Hospital Irmã Dulce',place:'Enfermaria — Leito 09',entry:daysAgo(9),priority:'Baixa',visit:'Realizada',last:daysAgo(1),next:plusDays(1),caps:'CAPS III Ocian',discharge:plusDays(6),age:51,sex:'Masculino',group:'Esquizofrenia e outros transtornos psicóticos',active:true,notes:'Síntese de alta em elaboração',hasCaps:true,interventions:[{id:'i5',cat:'Terapia ocupacional',owner:'Equipe demo',plan:'Atividades de rotina e autonomia',frequency:'3x/semana',goal:'Retomar atividades significativas',status:'Em andamento',review:plusDays(4)}],evolutions:[],history:[]},
 {id:'PG-DEMO-005',name:'Beatriz L.',unit:'Pronto-Socorro Central',place:'Observação — Box 03',entry:daysAgo(3),priority:'Média',visit:'Pendente',last:'—',next:today(),caps:'CAPS II Boqueirão',discharge:today(),age:19,sex:'Feminino',group:'Transtornos de ansiedade',active:true,notes:'Contato interunidades necessário',hasCaps:true,interventions:[],evolutions:[],history:[]},
 {id:'PG-DEMO-006',name:'Pedro F.',unit:'CAPS II Boqueirão',place:'Acompanhamento territorial',entry:daysAgo(12),priority:'Baixa',visit:'Realizada',last:daysAgo(2),next:plusDays(3),caps:'CAPS II Boqueirão',discharge:plusDays(3),age:63,sex:'Masculino',group:'Transtornos do humor',active:true,notes:'Reavaliação do PTS programada',hasCaps:true,interventions:[],evolutions:[],history:[]}
],events:[]};
function daysAgo(n){return dateOffset(-n)} function plusDays(n){return dateOffset(n)} function dateOffset(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function today(){return dateOffset(0)}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial}catch{db=initial}if(!db.patients)db=initial;
let page='census',section='geral',selected=null,patientTab='summary',filterUnit='Todas as unidades',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function fmt(d){if(!d||d==='—')return'—';let x=new Date(d+'T12:00:00');return x.toLocaleDateString('pt-BR')}function daysSince(d){return Math.max(0,Math.floor((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/86400000))}function patient(id){return db.patients.find(p=>p.id===id)}function setPage(p){page=p;render()}function badge(t){let cl=/Alta|Pendente|Vencida/i.test(t)?'red':/Média|Hoje|Andamento/i.test(t)?'amber':/Realizada|Concluída|Confirmada/i.test(t)?'green':'blue';return `<span class="badge ${cl}">${esc(t)}</span>`}
const navItems=[['census','▦','Censo'],['patients','♙','Pacientes'],['pts','✚','PTS'],['evolutions','▤','Evoluções'],['discharges','↗','Gestão de altas'],['dashboard','▥','Indicadores']];
function nav(){return `<aside class="sidebar"><div class="navlabel">Espaço assistencial</div><div class="nav">${navItems.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="setPage('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}</div><div class="side-note"><b>Ambiente demonstrativo</b><br>Dados fictícios para validação de fluxos. Não inserir informações de pacientes reais.</div></aside>`}
function header(){return `<header class="topbar"><div class="brand"><div class="brandmark">✚</div><div><strong>RAPS Praia Grande</strong><small>Sistema Integrado de Saúde Mental</small></div></div><div class="topright"><span class="demo-pill">● DEMONSTRAÇÃO</span><div class="userbox"><span class="avatar">${db.role.slice(0,1)}</span><span>${esc(db.role)}</span><select aria-label="Perfil demonstrativo" onchange="changeRole(this.value)" style="padding:7px;font-size:10px"><option ${db.role==='Psiquiatra visitador'?'selected':''}>Psiquiatra visitador</option><option ${db.role==='Coordenação da RAPS'?'selected':''}>Coordenação da RAPS</option><option ${db.role==='Psicólogo'?'selected':''}>Psicólogo</option><option ${db.role==='Gestor de indicadores'?'selected':''}>Gestor de indicadores</option></select></div></div></header>`}
function mobileNav(){return `<nav class="mobile-nav">${[['census','▦','Censo'],['patients','♙','Pacientes'],['pts','✚','PTS'],['evolutions','▤','Evoluções'],['dashboard','▥','Indicadores']].map(([id,i,l])=>`<button class="${page===id?'active':''}" onclick="setPage('${id}')"><span>${i}</span><span>${l}</span></button>`).join('')}</nav>`}
function head(title,sub,buttons=''){return `<div class="pagehead"><div><div class="eyebrow">Rede de Atenção Psicossocial</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function stat(title,value,sub,icon){return `<article class="card stat"><div class="stathead"><span>${title}</span><span class="staticon">${icon}</span></div><strong>${value}</strong><small>${sub}</small></article>`}
function censusPatients(){return db.patients.filter(p=>p.active).filter(p=>section==='externo'?!p.unit.includes('Hospital'):section==='hospital'?p.unit.includes('Hospital'):true).filter(p=>filterUnit==='Todas as unidades'||p.unit===filterUnit).filter(p=>!query||`${p.name} ${p.id} ${p.unit}`.toLowerCase().includes(query.toLowerCase()))}
function census(){let active=db.patients.filter(p=>p.active),pending=active.filter(p=>p.visit==='Pendente').length,external=active.filter(p=>!p.unit.includes('Hospital')).length;return `${head('Censo diário','Acompanhamento assistencial integrado · '+fmt(today()),'<button class="btn" onclick="window.print()">⎙ Imprimir censo</button>')}<div class="grid stats">${stat('Pacientes ativos',active.length,'em acompanhamento','♙')}${stat('Visitas pendentes',pending,'requerem avaliação','◷')}${stat('Unidades externas',external,'PS e UPAs','⌖')}${stat('Previsões para hoje',active.filter(p=>p.discharge<=today()).length,'revisar planejamento','↗')}</div><div class="card section"><div class="section-title"><h2>Censo assistencial</h2><small>Atualizado a partir dos registros demonstrativos</small></div><div class="filterrow" style="margin-bottom:13px"><div class="segment">${[['geral','Geral da RAPS'],['externo','Unidades externas'],['hospital','Hospital Irmã Dulce']].map(([id,label])=>`<button class="${section===id?'active':''}" onclick="setSection('${id}')">${label}</button>`).join('')}</div><select onchange="setFilter(this.value)"><option>Todas as unidades</option>${[...new Set(db.patients.map(p=>p.unit))].map(u=>`<option ${filterUnit===u?'selected':''}>${esc(u)}</option>`).join('')}</select><input placeholder="Buscar paciente ou identificador" value="${esc(query)}" oninput="setQuery(this.value)"></div><div class="tablewrap"><table><thead><tr><th>Paciente</th><th>Unidade / localização</th><th>Entrada</th><th>Permanência</th><th>Prioridade</th><th>Visita</th><th>Próxima avaliação</th><th>CAPS referência</th><th>Previsão alta</th><th></th></tr></thead><tbody>${censusPatients().map(p=>`<tr><td><span class="patient-name" onclick="openPatient('${p.id}')">${esc(p.name)}</span><span class="patient-id">${esc(p.id)}</span></td><td>${esc(p.unit)}<span class="patient-id">${esc(p.place)}</span></td><td>${fmt(p.entry)}</td><td>${daysSince(p.entry)} dias</td><td>${badge(p.priority)}</td><td>${badge(p.visit)}</td><td>${fmt(p.next)}</td><td>${esc(p.caps)}</td><td>${fmt(p.discharge)}</td><td><button class="link" onclick="openPatient('${p.id}')">Abrir ficha →</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">Nenhum paciente encontrado.</td></tr>'}</tbody></table></div></div><div class="footer-note">Dados exclusivamente fictícios · Protótipo não autorizado para uso clínico real.</div>`}
function openPatient(id){selected=id;patientTab='summary';page='patient';render()}function patientPage(){let p=patient(selected);if(!p){page='census';return census()}let tabs=[['summary','Resumo assistencial'],['pts','Projeto terapêutico'],['evolutions','Evoluções'],['history','Histórico']];return `${head('Ficha individual','Identificador '+p.id,`<button class="btn" onclick="window.print()">⎙ Imprimir</button><button class="btn primary" onclick="openEvolution('${p.id}')">＋ Registrar evolução</button>`)}<div class="card patienthero"><div><div class="eyebrow">${esc(p.unit)} · ${esc(p.place)}</div><h2>${esc(p.name)} <span class="badge blue">FICTÍCIO</span></h2><p>${esc(p.id)} · Entrada em ${fmt(p.entry)} · ${daysSince(p.entry)} dias de permanência</p><div class="details"><div class="detail"><small>CAPS de referência</small><strong>${esc(p.caps)}</strong></div><div class="detail"><small>Última visita psiquiátrica</small><strong>${fmt(p.last)}</strong></div><div class="detail"><small>Próxima avaliação</small><strong>${fmt(p.next)}</strong></div><div class="detail"><small>Previsão de alta</small><strong>${fmt(p.discharge)}</strong></div></div></div><div class="actions">${badge(p.priority)} ${badge(p.visit)}</div></div><div class="card section"><div class="tabrow">${tabs.map(([id,label])=>`<button class="${patientTab===id?'active':''}" onclick="setPatientTab('${id}')">${label}</button>`).join('')}</div>${patientTab==='summary'?summary(p):patientTab==='pts'?ptsContent(p):patientTab==='evolutions'?evolutionsContent(p):historyContent(p)}</div>`}
function summary(p){return `<div class="grid twocol"><section><div class="section-title"><h2>Resumo assistencial</h2><button class="link" onclick="openEditPatient('${p.id}')">Editar demonstração</button></div><div class="details" style="margin:0"><div class="detail"><small>Situação clínica</small><strong>Acompanhamento em curso</strong></div><div class="detail"><small>Sexo / faixa etária</small><strong>${esc(p.sex)} · ${p.age} anos</strong></div><div class="detail"><small>Grupo diagnóstico (demo)</small><strong>${esc(p.group)}</strong></div><div class="detail"><small>Visita</small><strong>${esc(p.visit)}</strong></div></div><div class="notice">${esc(p.notes||'Sem pendências registradas.')}</div><div class="section-title"><h2>Plano de continuidade do cuidado</h2></div><p class="muted" style="font-size:12px;line-height:1.7">Participação do usuário e família, contato com CAPS e confirmação de acolhimento são campos demonstrativos a serem detalhados no fluxo de alta responsável.</p><button class="btn" onclick="openIntegration('${p.id}')">＋ Registrar ação de integração</button></section><section><div class="section-title"><h2>Próximas ações</h2></div>${(p.interventions||[]).slice(0,3).map(i=>`<div class="intervention"><div class="interventiontop"><strong>${esc(i.cat)}</strong>${badge(i.status)}</div><p>${esc(i.plan)} · Reavaliar em ${fmt(i.review)}</p></div>`).join('')||'<div class="empty">Nenhuma intervenção registrada.</div>'}</section></div>`}
function ptsContent(p){return `<div class="section-title"><div><h2>Projeto Terapêutico Singular</h2><small>Construção compartilhada · dados demonstrativos</small></div><button class="btn primary" onclick="openIntervention('${p.id}')">＋ Nova intervenção</button></div><div class="grid twocol" style="margin-bottom:14px"><div class="detail"><small>Diagnóstico situacional ampliado</small><strong>Registro de demonstração — preencher em discussão multiprofissional.</strong></div><div class="detail"><small>Objetivos terapêuticos pactuados</small><strong>Autonomia, continuidade do cuidado e participação do usuário.</strong></div><div class="detail"><small>Plano de crise e fatores protetores</small><strong>Campo a ser pactuado pela equipe e usuário.</strong></div><div class="detail"><small>Previsão de alta vigente</small><strong>${fmt(p.discharge)} · previsão não é alta efetiva</strong></div></div><div class="section-title"><h2>Intervenções por categoria profissional</h2><small>${(p.interventions||[]).length} intervenção(ões)</small></div>${(p.interventions||[]).map(i=>`<div class="intervention"><div class="interventiontop"><div><strong>${esc(i.cat)}</strong><div class="patient-id">Responsável: ${esc(i.owner)} · Frequência: ${esc(i.frequency)}</div></div>${badge(i.status)}</div><p>${esc(i.plan)}<br><b>Meta:</b> ${esc(i.goal)} · <b>Reavaliar:</b> ${fmt(i.review)}</p><button class="link" onclick="updateIntervention('${p.id}','${i.id}')">Atualizar situação</button></div>`).join('')||'<div class="empty">Nenhuma intervenção cadastrada.</div>'}<div class="notice green">As contribuições multiprofissionais são mantidas como registros próprios no protótipo.</div>`}
function evolutionsContent(p){return `<div class="section-title"><h2>Evoluções multiprofissionais</h2><button class="btn primary" onclick="openEvolution('${p.id}')">＋ Registrar evolução</button></div>${p.evolutions.length?p.evolutions.slice().reverse().map(e=>`<div class="intervention"><div class="interventiontop"><strong>${esc(e.category)} · ${fmt(e.date)} ${esc(e.time)}</strong><span class="badge green">Finalizada</span></div><p><b>Profissional:</b> ${esc(e.professional)} · <b>Previsão de alta:</b> ${fmt(e.discharge)}<br><b>Avaliação:</b> ${esc(e.assessment)}<br><b>Condutas:</b> ${esc(e.conducts)}</p></div>`).join(''):'<div class="empty">Ainda não há evoluções registradas.</div>'}`}
function historyContent(p){return `<div class="section-title"><h2>Histórico de atendimento e movimentações</h2></div>${(p.history||[]).length?p.history.slice().reverse().map(h=>`<div class="histitem"><strong>${esc(h.title)}</strong><p>${fmt(h.date)} · ${esc(h.detail)}</p></div>`).join(''):'<div class="histitem"><strong>Entrada no episódio assistencial demonstrativo</strong><p>${fmt(p.entry)} · '+esc(p.unit)+' · Registro fictício</p></div>'}`}
function patientsPage(){return `${head('Pacientes','Lista de episódios ativos no ambiente de demonstração')}<div class="card section"><div class="filters"><input placeholder="Buscar nome ou identificador" oninput="setQuery(this.value)"></div><div class="tablewrap"><table><thead><tr><th>Paciente</th><th>Unidade</th><th>CAPS referência</th><th>Situação</th><th>Alta prevista</th><th></th></tr></thead><tbody>${db.patients.filter(p=>p.active).filter(p=>!query||`${p.name}${p.id}`.toLowerCase().includes(query.toLowerCase())).map(p=>`<tr><td><span class="patient-name" onclick="openPatient('${p.id}')">${esc(p.name)}</span><span class="patient-id">${p.id}</span></td><td>${esc(p.unit)}</td><td>${esc(p.caps)}</td><td>${badge(p.visit)}</td><td>${fmt(p.discharge)}</td><td><button class="link" onclick="openPatient('${p.id}')">Abrir →</button></td></tr>`).join('')}</tbody></table></div><div class="notice">A inclusão de pacientes reais está desabilitada. Os registros desta demonstração são fictícios.</div></div>`}
function ptsPage(){return `${head('Projetos terapêuticos','Acompanhe PTS e intervenções multiprofissionais')}<div class="card section"><div class="tablewrap"><table><thead><tr><th>Paciente fictício</th><th>Unidade</th><th>Intervenções</th><th>Em andamento</th><th>Previsão de alta</th><th></th></tr></thead><tbody>${db.patients.filter(p=>p.active).map(p=>`<tr><td>${esc(p.name)}<span class="patient-id">${p.id}</span></td><td>${esc(p.unit)}</td><td>${p.interventions.length}</td><td>${p.interventions.filter(i=>i.status==='Em andamento').length}</td><td>${fmt(p.discharge)}</td><td><button class="link" onclick="openPatient('${p.id}');setPatientTab('pts')">Abrir PTS →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function evolutionPage(){let es=db.patients.flatMap(p=>p.evolutions.map(e=>({...e,p}))).reverse();return `${head('Evoluções','Registros finalizados com autoria e previsão de alta')}<div class="card section"><div class="section-title"><h2>Registro multiprofissional</h2><small>${es.length} evolução(ões)</small></div>${es.length?es.map(e=>`<div class="intervention"><div class="interventiontop"><strong>${esc(e.p.name)} · ${esc(e.category)}</strong><span>${fmt(e.date)} ${esc(e.time)}</span></div><p>${esc(e.assessment)} · Previsão de alta: <b>${fmt(e.discharge)}</b></p></div>`).join(''):'<div class="empty">Nenhuma evolução finalizada. Acesse uma ficha para registrar.</div>'}</div>`}
function discharges(){let ps=db.patients.filter(p=>p.active),over=ps.filter(p=>p.discharge<today()),tod=ps.filter(p=>p.discharge===today()),week=ps.filter(p=>p.discharge>today()&&p.discharge<=plusDays(7));let groups=[['Previsões vencidas',over],['Previstas para hoje',tod],['Próximos sete dias',week],['Pendências de articulação',ps.filter(p=>!p.hasCaps||p.caps==='A definir'||/pendente|definir|necessário/i.test(p.notes))]];return `${head('Gestão de altas','Planejamento de alta responsável · previsão não representa alta efetiva')}<div class="grid stats">${stat('Previsões vencidas',over.length,'requerem reavaliação','⚠')}${stat('Previstas para hoje',tod.length,'confirmar continuidade','◷')}${stat('Próximos sete dias',week.length,'planejamento ativo','↗')}${stat('Pendências de articulação',groups[3][1].length,'com a rede/CAPS','⌖')}</div><div class="grid twocol">${groups.map(([title,list])=>`<div class="card section"><div class="section-title"><h2>${title}</h2><small>${list.length} paciente(s)</small></div>${list.map(p=>`<div class="intervention"><div class="interventiontop"><strong>${esc(p.name)}</strong>${badge(p.unit.includes('Hospital')?'Hospital':'Externo')}</div><p>${esc(p.unit)} · CAPS: ${esc(p.caps)}<br>Previsão: <b>${fmt(p.discharge)}</b> · ${esc(p.notes)}</p><button class="link" onclick="openPatient('${p.id}')">Abrir ficha →</button> <button class="link" onclick="openActualDischarge('${p.id}')">Registrar alta efetiva →</button></div>`).join('')||'<div class="empty">Nenhum registro neste bloco.</div>'}</div>`).join('')}</div>`}
function dashboard(){let ps=db.patients,acts=ps.filter(p=>p.active),inter=ps.flatMap(p=>p.interventions),evs=ps.flatMap(p=>p.evolutions),linked=acts.filter(p=>p.hasCaps).length,cats=['Psiquiatria','Psicologia','Enfermagem','Serviço social','Terapia ocupacional'];return `${head('Indicadores da RAPS','Painel gerencial demonstrativo · dados fictícios agregados','<button class="btn" onclick="window.print()">⎙ Exportar / imprimir PDF</button>')}<div class="filters"><select><option>Todo o período</option><option>Últimos 7 dias</option><option>Últimos 30 dias</option></select><select><option>Todas as unidades</option>${[...new Set(ps.map(p=>p.unit))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select><option>Todos os CAPS</option>${[...new Set(ps.map(p=>p.caps))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select><option>Todas as categorias</option>${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="grid stats">${stat('Pacientes únicos',ps.length,'episódios fictícios únicos','♙')}${stat('Pacientes ativos',acts.length,'em acompanhamento','◷')}${stat('Vinculados a CAPS',linked,`${Math.round(linked/Math.max(acts.length,1)*100)}% dos ativos`,'⌖')}${stat('Evoluções finalizadas',evs.length,'neste ambiente demo','▤')}</div><div class="grid twocol"><div class="card section"><div class="section-title"><h2>A. Censo e epidemiologia</h2><small>Pacientes ativos por unidade</small></div><div class="barlist">${[...new Set(acts.map(p=>p.unit))].map(u=>{let n=acts.filter(p=>p.unit===u).length;return `<div class="barrow"><span>${esc(u.replace('Hospital Irmã Dulce','Hospital').replace('Pronto-Socorro Central','PS Central').replace('PS/UPA ',''))}</span><div class="track"><div class="fill" style="width:${100*n/acts.length}%"></div></div><b>${n}</b></div>`}).join('')}</div><div class="section-title" style="margin-top:20px"><h2>Atendimentos por período</h2><small>últimos 7 dias</small></div><div class="chart">${[4,6,3,7,5,8,Math.max(evs.length,2)].map((v,i)=>`<div class="chartcol"><div class="chartbarwrap"><div class="chartbar" style="height:${Math.min(100,v*11)}%"></div></div><small>${['S','T','Q','Q','S','S','D'][i]}</small></div>`).join('')}</div></div><div class="card section"><div class="section-title"><h2>B. Integração da RAPS</h2></div>${[['Sem CAPS na entrada',acts.filter(p=>!p.hasCaps).length],['Vinculados a CAPS',linked],['Taxa de vinculação',`${Math.round(linked/Math.max(acts.length,1)*100)}%`],['Pendências de rede',acts.filter(p=>!p.hasCaps||/pendente|definir|necessário/i.test(p.notes)).length],['Altas efetivas',ps.filter(p=>!p.active).length]].map(([l,v])=>`<div class="metricline"><span>${l}</span><strong>${v}</strong></div>`).join('')}</div><div class="card section"><div class="section-title"><h2>C. PTS multiprofissional</h2></div>${[['PTS ativos',acts.length],['Intervenções planejadas',inter.length],['Em andamento',inter.filter(i=>i.status==='Em andamento').length],['Pendentes',inter.filter(i=>i.status==='Pendente').length],['Concluídas',inter.filter(i=>i.status==='Concluída').length]].map(([l,v])=>`<div class="metricline"><span>${l}</span><strong>${v}</strong></div>`).join('')}<div class="barlist" style="margin-top:14px">${cats.map(c=>{let n=inter.filter(i=>i.cat===c).length;return `<div class="barrow"><span>${c}</span><div class="track"><div class="fill" style="width:${inter.length?100*n/inter.length:0}%"></div></div><b>${n}</b></div>`}).join('')}</div></div><div class="card section"><div class="section-title"><h2>D. Gestão de altas</h2><button class="link" onclick="setPage('discharges')">Abrir painel →</button></div>${[['Previsões vencidas',acts.filter(p=>p.discharge<today()).length],['Hoje',acts.filter(p=>p.discharge===today()).length],['Próximos 7 dias',acts.filter(p=>p.discharge>today()&&p.discharge<=plusDays(7)).length],['Previsão não é alta efetiva','—']].map(([l,v])=>`<div class="metricline"><span>${l}</span><strong>${v}</strong></div>`).join('')}</div><div class="card section"><div class="section-title"><h2>E. Qualidade assistencial</h2></div>${[['Aguardando visita',acts.filter(p=>p.visit==='Pendente').length],['Visitas realizadas',acts.filter(p=>p.visit==='Realizada').length],['Evoluções com previsão obrigatória',evs.filter(e=>!!e.discharge).length],['Continuidade a confirmar',acts.filter(p=>!p.hasCaps).length]].map(([l,v])=>`<div class="metricline"><span>${l}</span><strong>${v}</strong></div>`).join('')}<div class="notice">Indicadores demonstrativos; métricas de reinternação, tempos e taxas necessitam de dados validados e definição de denominadores antes de uso institucional.</div></div></div>`}
function render(){let content=page==='census'?census():page==='patient'?patientPage():page==='patients'?patientsPage():page==='pts'?ptsPage():page==='evolutions'?evolutionPage():page==='discharges'?discharges():dashboard();document.getElementById('app').innerHTML=header()+`<div class="layout">${nav()}<main class="main">${content}<div class="footer-note">RAPS Praia Grande · Protótipo navegável · Dados fictícios · Não utilizar para assistência real</div></main></div>`+mobileNav()}
window.setPage=setPage;window.openPatient=openPatient;window.setPatientTab=t=>{patientTab=t;render()};window.setSection=x=>{section=x;filterUnit='Todas as unidades';render()};window.setFilter=x=>{filterUnit=x;render()};window.setQuery=x=>{query=x;let pos=document.activeElement?.selectionStart;render();let input=document.querySelector('.filters input, .filterrow input');if(input){input.focus();try{input.setSelectionRange(pos,pos)}catch{}}};window.changeRole=x=>{db.role=x;persist();render()};
function modal(title,body,submit,label='Salvar'){document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="modalback" onclick="if(event.target===this)this.remove()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="document.getElementById('modalback').remove()">×</button></div><form id="modalform"><div class="formgrid">${body}</div><div class="modalfoot"><button type="button" class="btn" onclick="document.getElementById('modalback').remove()">Cancelar</button><button class="btn primary" type="submit">${label}</button></div></form></div></div>`);document.getElementById('modalform').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target))}}
function openEvolution(id){let p=patient(id);modal('Nova evolução demonstrativa',`<div class="formfield"><label>Paciente</label><input value="${esc(p.name)} · ${p.id}" readonly></div><div class="formfield"><label>Categoria profissional *</label><select name="category" required>${['Psiquiatria','Psicologia','Enfermagem','Serviço social','Terapia ocupacional','Profissional CAPS'].map(x=>`<option ${x===db.role?'selected':''}>${x}</option>`).join('')}</select></div><div class="formfield"><label>Profissional / registro demo *</label><input name="professional" required value="Profissional demonstrativo"></div><div class="formfield"><label>Data e hora *</label><input type="date" name="date" value="${today()}" required></div><div class="formfield"><label>Hora *</label><input type="time" name="time" value="${new Date().toTimeString().slice(0,5)}" required></div><div class="formfield"><label>Previsão obrigatória de alta *</label><input type="date" name="discharge" value="${p.discharge}" required></div><div class="formfield full"><label>Avaliação *</label><textarea name="assessment" required placeholder="Registro exclusivamente fictício"></textarea></div><div class="formfield full"><label>Intervenções do PTS executadas (não conclui automaticamente)</label><select name="intervention" multiple style="min-height:65px">${p.interventions.map(i=>`<option value="${i.id}">${esc(i.cat)} — ${esc(i.plan)}</option>`).join('')}</select></div><div class="formfield full"><label>Intervenções realizadas *</label><textarea name="actions" required></textarea></div><div class="formfield full"><label>Condutas / pendências</label><textarea name="conducts"></textarea></div>${db.role==='Psiquiatra visitador'?'<div class="formfield full"><label>Exame do estado mental / avaliação de riscos (demo)</label><textarea name="mental"></textarea></div><div class="formfield full"><label>Tratamento medicamentoso / ajustes (demo)</label><textarea name="meds"></textarea></div>':''}`,f=>{if(!f.get('discharge')){alert('A previsão de alta é obrigatória.');return}if(f.get('discharge')!==p.discharge){let reason=prompt('Justifique a alteração da previsão de alta:');if(!reason||!reason.trim()){alert('É obrigatória justificativa para alterar a previsão.');return}p.history.push({date:today(),title:'Alteração de previsão de alta',detail:`${p.discharge} → ${f.get('discharge')} · ${reason} · ${f.get('professional')}`})}let selectedOptions=[...document.querySelector('[name=intervention]').selectedOptions].map(o=>o.value);p.evolutions.push({category:f.get('category'),professional:f.get('professional'),date:f.get('date'),time:f.get('time'),discharge:f.get('discharge'),assessment:f.get('assessment'),actions:f.get('actions'),conducts:f.get('conducts'),interventions:selectedOptions,mental:f.get('mental'),meds:f.get('meds')});p.discharge=f.get('discharge');p.last=f.get('date');p.next=plusDays(1);p.visit='Realizada';p.history.push({date:f.get('date'),title:'Evolução multiprofissional finalizada',detail:`${f.get('category')} · autoria ${f.get('professional')}`});db.events.push({type:'evolution',patient:id,date:f.get('date')});persist();document.getElementById('modalback').remove();render()},'Finalizar evolução')}
function openIntervention(id){let p=patient(id);modal('Nova intervenção no PTS',`<div class="formfield"><label>Paciente</label><input readonly value="${esc(p.name)} · ${p.id}"></div><div class="formfield"><label>Categoria profissional *</label><select name="cat" required>${['Psiquiatria','Psicologia','Enfermagem','Serviço social','Terapia ocupacional','Profissional CAPS'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="formfield"><label>Profissional responsável / registro *</label><input name="owner" required value="Profissional demonstrativo"></div><div class="formfield"><label>Frequência *</label><input name="frequency" required placeholder="Ex.: semanal"></div><div class="formfield"><label>Reavaliação *</label><input type="date" name="review" required value="${plusDays(7)}"></div><div class="formfield full"><label>Proposta terapêutica *</label><textarea name="plan" required></textarea></div><div class="formfield full"><label>Metas *</label><textarea name="goal" required></textarea></div>`,f=>{p.interventions.push({id:'i'+Date.now(),cat:f.get('cat'),owner:f.get('owner'),frequency:f.get('frequency'),review:f.get('review'),plan:f.get('plan'),goal:f.get('goal'),status:'Pendente'});p.history.push({date:today(),title:'Intervenção adicionada ao PTS',detail:f.get('cat')+' · '+f.get('owner')});persist();document.getElementById('modalback').remove();render()})}
function updateIntervention(id,iid){let p=patient(id),i=p.interventions.find(x=>x.id===iid);let status=prompt('Nova situação: Pendente, Em andamento, Concluída ou Reavaliar',i.status);if(!status)return;if(!['Pendente','Em andamento','Concluída','Reavaliar'].includes(status)){alert('Situação inválida.');return}i.status=status;p.history.push({date:today(),title:'Situação de intervenção atualizada',detail:`${i.cat} · ${status}`});persist();render()}
function openEditPatient(id){let p=patient(id);modal('Atualizar informações demonstrativas',`<div class="formfield"><label>CAPS de referência</label><select name="caps">${['A definir','CAPS II Boqueirão','CAPS III Ocian','CAPS AD Praia Grande'].map(x=>`<option ${p.caps===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="formfield"><label>Prioridade</label><select name="priority">${['Alta','Média','Baixa'].map(x=>`<option ${p.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="formfield"><label>Próxima avaliação</label><input type="date" name="next" value="${p.next}"></div><div class="formfield"><label>Previsão de alta</label><input type="date" name="discharge" value="${p.discharge}" required></div><div class="formfield full"><label>Pendências</label><textarea name="notes">${esc(p.notes)}</textarea></div>`,f=>{if(f.get('discharge')!==p.discharge){let reason=prompt('Justifique alteração da previsão:');if(!reason)return;p.history.push({date:today(),title:'Alteração de previsão de alta',detail:`${p.discharge} → ${f.get('discharge')} · ${reason}`})}Object.assign(p,{caps:f.get('caps'),hasCaps:f.get('caps')!=='A definir',priority:f.get('priority'),next:f.get('next'),discharge:f.get('discharge'),notes:f.get('notes')});persist();document.getElementById('modalback').remove();render()})}
function openIntegration(id){let p=patient(id);modal('Ação de integração com a rede',`<div class="formfield"><label>Tipo de ação *</label><select name="type">${['Contato interunidades','Discussão de caso','Reunião de rede','Matriciamento','Roda de conversa','Contrarreferência'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="formfield"><label>Serviço / CAPS *</label><input name="service" value="${esc(p.caps)}" required></div><div class="formfield"><label>Situação *</label><select name="status"><option>Solicitado</option><option>Aceito</option><option>Agendado</option><option>Realizado</option></select></div><div class="formfield"><label>Data</label><input type="date" name="date" value="${today()}"></div><div class="formfield full"><label>Registro / plano de continuidade</label><textarea name="detail"></textarea></div><div class="formfield"><label>Participação do usuário/família</label><select name="participation"><option>A pactuar</option><option>Participou</option><option>Não participou</option></select></div><div class="formfield"><label>Confirmação acolhimento/agendamento</label><select name="confirm"><option>Pendente</option><option>Confirmado</option><option>Não confirmado</option></select></div>`,f=>{p.history.push({date:f.get('date'),title:`Integração: ${f.get('type')} · ${f.get('status')}`,detail:`${f.get('service')} · ${f.get('detail')} · Participação: ${f.get('participation')}; acolhimento: ${f.get('confirm')}`});persist();document.getElementById('modalback').remove();render()})}
function openActualDischarge(id){let p=patient(id);modal('Registrar alta efetiva',`<div class="notice">A previsão de alta é distinta da alta efetiva. Esta ação encerra o episódio de demonstração.</div><div class="formfield"><label>Paciente</label><input readonly value="${esc(p.name)} · ${p.id}"></div><div class="formfield"><label>Data efetiva *</label><input type="date" name="date" required value="${today()}"></div><div class="formfield"><label>Destino *</label><select name="destination" required>${['CAPS de referência','Domicílio com acompanhamento','Outra unidade de saúde','Outro destino'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="formfield"><label>Profissional responsável *</label><input name="professional" required value="Profissional demonstrativo"></div><div class="formfield full"><label>Continuidade do cuidado / plano *</label><textarea name="plan" required></textarea></div>`,f=>{p.active=false;p.actualDischarge=f.get('date');p.history.push({date:f.get('date'),title:'Alta efetiva registrada',detail:`Destino: ${f.get('destination')} · ${f.get('professional')} · ${f.get('plan')}`});persist();document.getElementById('modalback').remove();render()},'Confirmar alta efetiva')}
render();
})();
</script>
</body>
</html>
